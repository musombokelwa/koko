<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Maquette de l'interface Koko</title>
  <desc id="desc">Interface futuriste et calme d'un assistant vocal avec globe, voix, recherche web, vision par ordinateur et sécurité.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="45%" r="75%"><stop stop-color="#102c4a"/><stop offset=".55" stop-color="#071525"/><stop offset="1" stop-color="#030914"/></radialGradient>
    <radialGradient id="globe" cx="35%" cy="28%"><stop stop-color="#1a6a91" stop-opacity=".9"/><stop offset=".58" stop-color="#0b2c48" stop-opacity=".9"/><stop offset="1" stop-color="#061525" stop-opacity=".98"/></radialGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#173d5a" stop-opacity=".75"/><stop offset="1" stop-color="#092238" stop-opacity=".5"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#9df4ff"/><stop offset="1" stop-color="#55a5ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sphere"><circle cx="800" cy="465" r="250"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="800" cy="465" r="310" fill="#2fd7ff" opacity=".08" filter="url(#blur)"/>
  <path d="M0 115H1600M0 885H1600M225 0V1000M1375 0V1000" stroke="#1e6285" opacity=".18"/>
  <path d="M0 205H1600M0 795H1600M390 0V1000M1210 0V1000" stroke="#1e6285" opacity=".08"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="72" fill="#f1fbff" font-size="31" font-weight="700" letter-spacing="7">KOKO</text>
    <text x="75" y="103" fill="#74a6c2" font-size="12" font-weight="700" letter-spacing="3">PRIVATE VOICE OPERATING SPACE</text>
    <g transform="translate(1340 60)"><circle cx="0" cy="0" r="7" fill="#71f2ba"/><text x="20" y="5" fill="#b9d9e8" font-size="13" letter-spacing="2">VOICE ONLINE</text></g>

    <g transform="translate(58 165)">
      <rect width="250" height="555" rx="22" fill="url(#glass)" stroke="#2d6683"/>
      <text x="30" y="42" fill="#7bdfff" font-size="12" font-weight="700" letter-spacing="2">LIVE MODULES</text>
      <g transform="translate(30 82)"><circle r="6" fill="#71f2ba"/><text x="20" y="5" fill="#edfaff" font-size="16">VOICE INPUT</text><text x="20" y="28" fill="#7297ae" font-size="12">Double clap armed</text></g>
      <g transform="translate(30 160)"><circle r="6" fill="#71f2ba"/><text x="20" y="5" fill="#edfaff" font-size="16">SPEECH OUTPUT</text><text x="20" y="28" fill="#7297ae" font-size="12">French · soft · clear</text></g>
      <g transform="translate(30 238)"><circle r="6" fill="#71f2ba"/><text x="20" y="5" fill="#edfaff" font-size="16">WEB RESEARCH</text><text x="20" y="28" fill="#7297ae" font-size="12">Verified when needed</text></g>
      <g transform="translate(30 316)"><circle r="6" fill="#6bc8ff"/><text x="20" y="5" fill="#edfaff" font-size="16">COMPUTER VISION</text><text x="20" y="28" fill="#7297ae" font-size="12">Ready for visual context</text></g>
      <path d="M30 375H220" stroke="#24516d"/>
      <text x="30" y="415" fill="#7bdfff" font-size="11" font-weight="700" letter-spacing="2">PRIVACY</text>
      <text x="30" y="447" fill="#e6f8ff" font-size="14">Private by design</text>
      <text x="30" y="475" fill="#7297ae" font-size="12">No keys or system paths</text>
      <text x="30" y="498" fill="#7297ae" font-size="12">spoken to the user</text>
    </g>

    <g filter="url(#glow)">
      <circle cx="800" cy="465" r="250" fill="url(#globe)" stroke="#79eaff" stroke-width="2"/>
      <circle cx="800" cy="465" r="237" fill="none" stroke="#2e8eb1"/>
      <g clip-path="url(#sphere)" fill="none" stroke="#48b8d9" opacity=".7">
        <ellipse cx="800" cy="465" rx="238" ry="65"/><ellipse cx="800" cy="465" rx="238" ry="143"/><ellipse cx="800" cy="465" rx="238" ry="215"/>
        <ellipse cx="800" cy="465" rx="75" ry="250"/><ellipse cx="800" cy="465" rx="170" ry="250"/><ellipse cx="800" cy="465" rx="226" ry="250"/>
        <path d="M545 465H1055M800 215V715" stroke="#96e8f7" opacity=".7"/>
      </g>
      <circle cx="735" cy="390" r="6" fill="#b8fbff"/><circle cx="890" cy="475" r="5" fill="#71f2ba"/><circle cx="760" cy="560" r="4" fill="#b8fbff"/>
    </g>
    <text x="800" y="462" fill="#f1fdff" text-anchor="middle" font-size="29" font-weight="700" letter-spacing="8">KOKO</text>
    <text x="800" y="493" fill="#8ddbed" text-anchor="middle" font-size="12" letter-spacing="4">LISTEN · UNDERSTAND · RESPOND</text>
    <text x="800" y="785" fill="#6eaac1" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3">TRUSTED LOCAL PRESENCE</text>

    <g transform="translate(1110 165)">
      <rect width="430" height="555" rx="22" fill="url(#glass)" stroke="#2d6683"/>
      <text x="30" y="42" fill="#7bdfff" font-size="12" font-weight="700" letter-spacing="2">CONTROL CENTRE</text>
      <text x="30" y="86" fill="#f1fbff" font-size="28" font-weight="700">Ready to listen.</text>
      <text x="30" y="119" fill="#80a8be" font-size="14">Speak naturally. Koko will guide the exchange.</text>
      <rect x="30" y="153" width="370" height="58" rx="13" fill="#77e9ff"/>
      <text x="215" y="189" fill="#061522" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2">START KOKO</text>
      <text x="30" y="260" fill="#7bdfff" font-size="11" font-weight="700" letter-spacing="2">CURRENT STATE</text>
      <circle cx="38" cy="292" r="6" fill="#71f2ba"/><text x="55" y="298" fill="#eafaff" font-size="15">Microphone ready</text>
      <circle cx="38" cy="329" r="6" fill="#71f2ba"/><text x="55" y="335" fill="#eafaff" font-size="15">Conversation protected</text>
      <circle cx="38" cy="366" r="6" fill="#71f2ba"/><text x="55" y="372" fill="#eafaff" font-size="15">Search available</text>
      <path d="M30 405H400" stroke="#24516d"/>
      <text x="30" y="444" fill="#7bdfff" font-size="11" font-weight="700" letter-spacing="2">VISION CONTROL</text>
      <text x="30" y="476" fill="#eafaff" font-size="14">Visual context can be inspected</text>
      <text x="30" y="501" fill="#7297ae" font-size="12">only with explicit user permission.</text>
    </g>

    <g transform="translate(320 860)">
      <rect width="960" height="82" rx="18" fill="#0b2136" stroke="#24516d"/>
      <text x="25" y="28" fill="#7bdfff" font-size="11" font-weight="700" letter-spacing="2">TECHNICAL FLOW</text>
      <g fill="#eafaff" font-size="13" font-weight="600"><text x="25" y="57">MIC</text><text x="218" y="57">SPEECH TO TEXT</text><text x="465" y="57">SAFE REASONING</text><text x="700" y="57">WEB SEARCH</text><text x="870" y="57">VOICE</text></g>
      <g stroke="#72e5ff" stroke-width="2" fill="none"><path d="M70 52H190M350 52H435M600 52H670M775 52H845"/><path d="m182 47 9 5-9 5m245-5 9 5-9 5m235-5 9 5-9 5m170-5 9 5-9 5"/></g>
    </g>
    <text x="800" y="982" text-anchor="middle" fill="#527f98" font-size="11" letter-spacing="2">DESIGN MOCKUP · KOKO ASSISTANT · SAFE, CALM, HUMAN-CENTRED</text>
  </g>
</svg>
